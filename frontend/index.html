<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essay Reviewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #f5f5f5; }

/* ---- sidebar ---- */
.sidebar {
  width: 300px; min-width: 300px; background: #fff; border-right: 1px solid #e0e0e0;
  display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 20px; border-bottom: 1px solid #e0e0e0;
  font-size: 18px; font-weight: 600; color: #333;
}
.file-list { flex: 1; overflow-y: auto; padding: 12px; }
.file-item {
  padding: 10px 12px; margin-bottom: 4px; border-radius: 8px;
  display: flex; align-items: center; gap: 10px; cursor: default;
  transition: background 0.15s;
}
.file-item:hover { background: #f0f0f0; }
.file-icon { font-size: 20px; }
.file-name { flex: 1; font-size: 14px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chunks { font-size: 12px; color: #999; white-space: nowrap; }
.file-empty { text-align: center; color: #bbb; margin-top: 40px; font-size: 14px; }

.sidebar-footer { padding: 16px; border-top: 1px solid #e0e0e0; }
.btn-upload {
  width: 100%; padding: 10px; border: 2px dashed #ccc; border-radius: 8px;
  background: #fafafa; color: #666; font-size: 14px; cursor: pointer;
  transition: all 0.15s;
}
.btn-upload:hover { border-color: #4f46e5; color: #4f46e5; background: #f0eeff; }

/* ---- main ---- */
.main { flex: 1; display: flex; flex-direction: column; background: #fafafa; }
.chat-header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #e0e0e0; font-weight: 600; font-size: 16px; }
.chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

.msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: #4f46e5; color: #fff; }
.msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e0e0e0; color: #333; }

.chat-input-area { padding: 16px 24px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; gap: 12px; }
.chat-input-area input {
  flex: 1; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 8px;
  font-size: 14px; outline: none; transition: border 0.15s;
}
.chat-input-area input:focus { border-color: #4f46e5; }
.chat-input-area button {
  padding: 10px 24px; background: #4f46e5; color: #fff; border: none;
  border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.15s;
}
.chat-input-area button:hover { background: #4338ca; }
.chat-input-area button:disabled { background: #ccc; cursor: not-allowed; }

.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.hidden-file-input { display: none; }
</style>
</head>
<body>

<!-- ====== sidebar ====== -->
<div class="sidebar">
  <div class="sidebar-header">📚 我的知识库</div>
  <div class="file-list" id="fileList">
    <div class="file-empty">暂无 PDF 文件</div>
  </div>
  <div class="sidebar-footer">
    <input type="file" id="fileInput" class="hidden-file-input" accept=".pdf" multiple>
    <button class="btn-upload" id="btnUpload">+ 上传 PDF 文件</button>
  </div>
</div>

<!-- ====== main chat ====== -->
<div class="main">
  <div class="chat-header">💬 AI 助手</div>
  <div class="chat-messages" id="chatMessages">
    <div class="msg assistant">你好！我是你的知识库助手，可以基于你上传的文档回答问题。请先上传 PDF 文件，或直接开始提问。</div>
  </div>
  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')send()">
    <button id="btnSend" onclick="send()">发送</button>
  </div>
</div>

<script>
// ---------- load file list ----------
async function loadFiles() {
  const list = document.getElementById('fileList');
  try {
    const resp = await fetch('/api/files');
    const files = await resp.json();
    if (files.length === 0) {
      list.innerHTML = '<div class="file-empty">暂无 PDF 文件</div>';
    } else {
      list.innerHTML = files.map(f => `
        <div class="file-item">
          <span class="file-icon">📄</span>
          <span class="file-name" title="${f.filename}">${f.filename}</span>
          <span class="file-chunks">${f.chunks} 片段</span>
        </div>
      `).join('');
    }
  } catch (e) {
    list.innerHTML = '<div class="file-empty">加载失败</div>';
  }
}

// ---------- upload ----------
document.getElementById('btnUpload').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = e.target.files;
  if (files.length === 0) return;

  const btn = document.getElementById('btnUpload');
  for (const file of files) {
    btn.textContent = `正在上传: ${file.name}...`;
    btn.disabled = true;
    const form = new FormData();
    form.append('file', file);
    await fetch('/upload', { method: 'POST', body: form });
  }
  btn.textContent = '+ 上传 PDF 文件';
  btn.disabled = false;
  document.getElementById('fileInput').value = '';
  loadFiles();
});

// ---------- chat ----------
async function send() {
  const input = document.getElementById('chatInput');
  const messages = document.getElementById('chatMessages');
  const btn = document.getElementById('btnSend');
  const text = input.value.trim();
  if (!text) return;

  // add user message
  const userDiv = document.createElement('div');
  userDiv.className = 'msg user';
  userDiv.textContent = text;
  messages.appendChild(userDiv);
  input.value = '';

  // add placeholder
  const assistantDiv = document.createElement('div');
  assistantDiv.className = 'msg assistant';
  assistantDiv.innerHTML = '<span class="spinner"></span>';
  messages.appendChild(assistantDiv);
  messages.scrollTop = messages.scrollHeight;

  btn.disabled = true;

  // call API
  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await resp.json();
    assistantDiv.textContent = data.answer;
  } catch (e) {
    assistantDiv.textContent = '请求失败，请确认服务已启动。';
  }

  btn.disabled = false;
  messages.scrollTop = messages.scrollHeight;
}

// ---------- init ----------
loadFiles();
</script>
</body>
</html>
